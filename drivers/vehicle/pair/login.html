<header class="homey-header">
	<h1 class="homey-title">
		Polestar Account
	</h1>
	<p class="homey-subtitle">
		Please provide your account details.<br />
		These will be stored on your Homey encrypted and used to login during app operations.
	</p>
</header>
<img src="../assets/images/polestar.png" style="width: 100%; max-width: 420px; height: auto; margin-bottom: 20px;" />
<form class="homey-form" id="loginForm">
	<fieldset class="homey-form-fieldset">
		<legend class="homey-form-legend">Account settings</legend>

		<div class="homey-form-group">
			<label class="homey-form-label" for="username">Username</label>
			<input class="homey-form-input" id="username" name="username" type="text" value="" />
		</div>
		<div class="homey-form-group">
			<label class="homey-form-label" for="password">Password</label>
			<input class="homey-form-input" id="password" name="password" type="password" value="" />
		</div>
		<button class="homey-button-primary-full" id="save">Login</button>
	</fieldset>
</form>

<script type="text/javascript">
	// Vanilla JS — do NOT rely on a global jQuery ($). Recent Homey firmware no
	// longer injects jQuery into pair webviews, so `$(document).ready(...)` threw
	// a silent ReferenceError here, leaving the Login button dead and emitting
	// nothing to the driver (pairing appeared to hang / return no vehicles).
	(function () {
		function byId(id) { return document.getElementById(id); }
		try {
			var form = byId('loginForm');
			var usernameEl = byId('username');
			var passwordEl = byId('password');

			Homey.on('loadaccount', function (credentials) {
				if (credentials) {
					usernameEl.value = credentials.username || '';
					passwordEl.value = credentials.password || '';
				}
			});

			Homey.on('noVehiclesFound', function (message) {
				Homey.alert(message);
				return Homey.done();
			});

			form.addEventListener('submit', function (e) {
				e.preventDefault();
				Homey.showLoadingOverlay();
				Homey.emit('testlogin', {
					username: usernameEl.value,
					password: passwordEl.value
				}).then(function (result) {
					// Backwards compat: older driver returned a plain boolean.
					var ok = result === true || (result && result.ok === true);
					var reason = result && result.reason;
					if (ok) {
						return Homey.emit('discover_vehicles').then(function (r) {
							Homey.hideLoadingOverlay();
							if (r) { Homey.nextView(); }
						});
					}
					Homey.hideLoadingOverlay();
					if (reason === 'no_vehicles') {
						Homey.alert("Login succeeded, but no vehicles were returned for this account. This usually means the Polestar ID is a guest / secondary driver rather than the car's owner (primary driver), the car is registered to a lease company, or you're signed in with the wrong Polestar ID. It can also be a brief Polestar backend hiccup — try again in a minute.");
					} else {
						Homey.alert("Login validation failed — check your e-mail address and password and try again.");
					}
				}).catch(function (err) {
					Homey.hideLoadingOverlay();
					Homey.alert("Something went wrong talking to the app: " + (err && err.message ? err.message : err));
				});
			});
		} catch (err) {
			// A synchronous failure here would otherwise be invisible in the webview.
			try { Homey.alert("Pairing screen failed to initialise: " + (err && err.message ? err.message : err)); } catch (e) { /* noop */ }
		}
	})();
</script>
